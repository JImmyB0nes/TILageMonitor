name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: false  # Tests deaktiviert (2026-11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/TILageMonitor.Tests.csproj

      - name: Test
        run: dotnet test tests/TILageMonitor.Tests.csproj -c Release --no-restore
